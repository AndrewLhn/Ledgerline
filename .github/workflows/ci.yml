name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: python -m compileall -q dags infra scripts tests
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="dags/*,infra/*,scripts/*" --skip-empty
      - run: python -c "from infra.producer import main"
      - run: ruff check dags infra scripts tests
      - name: Build Airflow image
        run: docker build -t ledgerline-airflow:ci .
