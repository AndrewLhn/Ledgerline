name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: python -m compileall -q dags infra scripts tests
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="dags/*,infra/*,scripts/*" --skip-empty
      - name: Contract checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CONTRACT_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'contract-breaking') }}
        run: |
          args=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            args="--base FETCH_HEAD"
            if [ "$CONTRACT_OVERRIDE" = "true" ]; then
              args="$args --allow-changes"
            fi
          fi
          python scripts/check_contract_compat.py $args
      - name: pyiceberg API surface
        run: |
          pip install -r infra/requirements.txt
          python - <<'PY'
          from pyiceberg.catalog import Catalog
          from pyiceberg.table import Table

          expected = {
              Catalog: [
                  "create_namespace_if_not_exists",
                  "load_table",
                  "create_table",
                  "commit_table",
              ],
              Table: ["append", "update_schema", "manage_snapshots"],
          }
          for cls, names in expected.items():
              missing = [name for name in names if not hasattr(cls, name)]
              if missing:
                  raise SystemExit(f"{cls.__name__} lost API: {missing}")
          print("pyiceberg API surface OK")
          PY
      - run: python -c "from infra.producer import main"
      - run: ruff check dags infra scripts tests
      - name: Build Airflow image
        run: docker build -t ledgerline-airflow:ci .
