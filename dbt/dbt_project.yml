name: ledgerline
version: "1.0.0"
config-version: 2

profile: ledgerline

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  ledgerline:
    # Models land in the profile's target schema (analytics). Adding a custom
    # +schema here would concatenate into analytics_analytics.
    staging:
      +materialized: table
    marts:
      +materialized: table
