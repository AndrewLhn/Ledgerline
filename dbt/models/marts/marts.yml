version: 2

models:
  - name: dim_event_payloads
    description: Deduplicated Ledgerline event payload dimension.
    columns:
      - name: event_hash
        tests: [not_null, unique]
      - name: event_payload
        tests: [not_null, not_empty_string]

  - name: fct_kafka_events
    description: Analytics-ready, deduplicated Ledgerline event facts.
    columns:
      - name: source_event_id
        tests: [not_null, unique]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["order_created", "payment_captured", "refund_issued", "inventory_adjusted"]
      - name: event_occurred_at
        tests: [not_null, not_future_timestamp]
      - name: event_ingested_at
        tests: [not_null, not_future_timestamp]
      - name: ingestion_lag_seconds
        tests: [not_null]
      - name: event_hash
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_payloads')
                field: event_hash
      - name: event_payload
        tests: [not_null, not_empty_string]
      - name: transformed_at
        tests: [not_null, not_future_timestamp]

  - name: mart_event_metrics_daily
    description: Daily Ledgerline event-volume, cardinality, and freshness metrics.
    columns:
      - name: metric_date
        tests: [not_null]
      - name: event_count
        tests: [not_null, is_positive]
      - name: distinct_payload_count
        tests: [not_null, is_positive]
      - name: distinct_source_event_count
        tests: [not_null, is_positive]
      - name: max_ingestion_lag_seconds
        tests: [not_null]
      - name: late_event_count
        description: Events ingested more than one hour after occurrence.
        tests: [not_null, is_non_negative]

  - name: fct_ledgerline_events
    description: Domain-ready financial and inventory events parsed from the Ledgerline envelope.
    columns:
      - name: source_event_id
        tests: [not_null, unique]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["order_created", "payment_captured", "refund_issued", "inventory_adjusted"]
      - name: event_occurred_at
        tests: [not_null, not_future_timestamp]
      - name: correlation_id
        tests: [not_null, not_empty_string]
      - name: amount_minor
        description: Monetary amount in minor currency units; null for non-financial events.
      - name: amount
        description: amount_minor converted to major units as decimal(18,2).
      - name: payment_method
        description: Contract v2 payment method (card, wallet, bank_transfer); null for v1 events.

  - name: mart_ingestion_health_daily
    description: Daily ingestion batch counts, throughput, rejections, and durations.
    columns:
      - name: metric_date
        tests: [not_null, unique]
      - name: batch_count
        tests: [not_null, is_positive]
      - name: records_read
        tests: [not_null, is_non_negative]
      - name: records_written
        tests: [not_null, is_non_negative]
      - name: records_rejected
        tests: [not_null, is_non_negative]
      - name: max_batch_duration_ms
        tests: [not_null, is_non_negative]

  - name: mart_daily_reconciliation
    description: Daily comparison of net captured cash and recognised revenue in the synthetic Ledgerline scenario.
    columns:
      - name: metric_date
        tests: [not_null, unique]
      - name: reconciliation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["passed", "failed"]

exposures:
  - name: finance_daily_reconciliation
    type: notebook
    description: Finance operations review of daily net cash versus recognised revenue.
    owner:
      name: Ledgerline data team
      email: data-team@ledgerline.local
    depends_on:
      - ref('mart_daily_reconciliation')
      - ref('mart_event_metrics_daily')
